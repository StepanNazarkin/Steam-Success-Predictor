apiVersion: apps/v1
kind: Deployment
metadata:
  name: steam-predictor-deployment
  labels:
    app: steam-predictor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: steam-predictor
  template:
    metadata:
      labels:
        app: steam-predictor
    spec:
      containers:
        - name: steam-predictor
          image: steam-success-predictor:v1
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3